<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lift</title>
<meta name="theme-color" content="#f5f5f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lift">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
/* ---------- tokens ---------- */
:root{
  color-scheme: light;
  --bg:#f5f5f4; --surface:#ffffff; --surface-2:#eeeeec; --line:#dcdad5;
  --ink:#1c1c1a; --ink-2:#57554e; --ink-3:#77756c;
  --accent:#d95926;      /* lifting  (categorical slot 2) */
  --blue:#3987e5;        /* running  (categorical slot 1) */
  --aqua:#199e70;        /* bodyweight (categorical slot 3) */
  --pb:#c98500;          /* highlight, never a series */
  --danger:#e66767;
  --r:14px;
  --tabh:58px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior-y:none}
body{
  background:var(--bg); color:var(--ink);
  font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%; touch-action:manipulation;
  display:flex; flex-direction:column;
}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface-2);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;appearance:none}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
select{padding-right:36px;background-repeat:no-repeat;background-position:right 13px center;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1.6 6 6.4 11 1.6' fill='none' stroke='%23c3c2b7' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/></svg>")}
::placeholder{color:var(--ink-3)}

/* ---------- shell ---------- */
#app{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top) + 10px) 14px calc(var(--tabh) + env(safe-area-inset-bottom) + 24px)}
.view{display:none}.view.on{display:block}

.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px}
.head h1{font-size:26px}
.sub{color:var(--ink-3);font-size:13px;margin-top:2px}
.iconbtn{width:38px;height:38px;border-radius:50%;background:var(--surface);
  display:grid;place-items:center;flex:none;color:var(--ink-2)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;margin-bottom:12px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);
  font-weight:600;margin-bottom:10px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  min-height:52px;border-radius:12px;background:var(--accent);color:#fff;font-weight:650;font-size:17px}
.btn.sec{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:42px;font-size:15px}
.btn.blue{background:var(--blue)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn:active{filter:brightness(.88)}
.row{display:flex;gap:8px}
.row>*{flex:1}

/* ---------- summary ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
  border-radius:12px;overflow:hidden}
.stat{background:var(--surface);padding:12px 13px}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.stat .v{font-size:24px;font-weight:650;letter-spacing:-.02em;margin-top:3px;
  font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;font-weight:500;color:var(--ink-3);margin-left:2px}
.dots{display:flex;gap:5px;margin-top:8px}
.dot{width:100%;height:5px;border-radius:3px;background:var(--surface-2)}
.dot.f{background:var(--accent)}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:12px 13px;text-align:left;width:100%}
.item .g{flex:1;min-width:0}
.item .t{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .d{color:var(--ink-3);font-size:13px;margin-top:2px}
.item .r{color:var(--ink-2);font-size:14px;text-align:right;flex:none;
  font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11px;font-weight:650;letter-spacing:.04em;
  padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);text-transform:uppercase}
.pill.up{background:rgba(217,89,38,.14);color:#a8431a}
.pill.lo{background:rgba(57,135,229,.14);color:#2568b3}
.pill.pb{background:rgba(201,133,0,.16);color:#9c6a00}
.empty{color:var(--ink-3);font-size:14px;text-align:center;padding:22px 10px;line-height:1.5}

/* ---------- session ---------- */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:13px;margin-bottom:10px}
.ex .name{font-weight:650;font-size:17px}
.ex .meta{color:var(--ink-3);font-size:13px;margin-top:3px}
.ex .last{color:var(--ink-2);font-size:13px;margin-top:6px;
  font-variant-numeric:tabular-nums;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.chip{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;
  padding:7px 10px;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;
  display:flex;align-items:center;gap:6px}
.chip.best{border-color:var(--pb);color:#9c6a00}
.chip .x{color:var(--ink-3);font-size:13px}
.entry{display:flex;gap:8px;align-items:flex-end;margin-top:11px}
.fld{flex:1;min-width:0}
.fld label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink-3);margin-bottom:5px}
.step{display:flex;align-items:stretch;background:var(--surface-2);
  border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step button{width:40px;flex:none;font-size:22px;font-weight:400;color:var(--ink-2);
  display:grid;place-items:center}
.step button:active{background:var(--line)}
.step input{border:0;border-radius:0;background:none;text-align:center;padding:11px 0;
  font-weight:650;font-variant-numeric:tabular-nums;min-width:0}
.step input:focus{outline:none;background:var(--line)}
.addset{flex:none;width:auto;padding:0 18px;min-height:46px;border-radius:10px;
  background:var(--accent);color:#fff;font-weight:650;display:grid;place-items:center}
.hint{color:var(--ink-3);font-size:12px;margin-top:8px}

/* ---------- charts ---------- */
.chart{position:relative;width:100%;height:172px;touch-action:pan-y}
.chart svg{display:block;width:100%;height:100%}
.tip{position:absolute;pointer-events:none;background:var(--surface-2);
  border:1px solid var(--line);border-radius:9px;padding:6px 9px;font-size:12px;
  color:var(--ink);white-space:nowrap;transform:translate(-50%,-115%);opacity:0;
  transition:opacity .1s;font-variant-numeric:tabular-nums;z-index:5;
  box-shadow:0 6px 18px rgba(0,0,0,.5)}
.tip.on{opacity:1}
.tip b{font-weight:650}.tip i{font-style:normal;color:var(--ink-3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.sw.ln{height:3px;width:14px;border-radius:2px}

/* ---------- challenges ---------- */
/* Kind is carried by --k so one rule set colours cards, pills and buttons. */
.k-lift{--k:var(--accent)} .k-run{--k:var(--blue)} .k-body{--k:var(--aqua)} .k-fun{--k:var(--pb)}
.pill.kind{background:color-mix(in srgb, var(--k) 15%, transparent);color:var(--k)}

.hero{display:flex;align-items:center;gap:13px;width:100%;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:12px;text-align:left}
.hero .ic{width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;
  background:var(--accent);color:#fff;font-size:22px}
.hero .t{font-size:19px;font-weight:650}
.hero .d{color:var(--ink-3);font-size:13px;margin-top:2px}
.hero:active{filter:brightness(.96)}

/* Four kind chips have to sit on one row at 402px, so they run tight. */
.chipbar{display:flex;gap:5px;flex-wrap:wrap}
.fchip{padding:7px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);
  font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.fchip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.chal{border-color:var(--k)}
.chal .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.chal .nm{font-size:22px;font-weight:650;letter-spacing:-.015em;line-height:1.15}
.chal .bl{color:var(--ink-2);font-size:14px;line-height:1.5;margin-top:8px}
.presc{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;
  padding:13px;margin-top:12px;text-align:center}
.presc .v{font-size:25px;font-weight:650;letter-spacing:-.02em;color:var(--k);
  font-variant-numeric:tabular-nums}
.presc .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin-bottom:4px}
.chal .why{color:var(--ink-3);font-size:12.5px;line-height:1.5;margin-top:10px}
.chal .acts{display:flex;gap:8px;margin-top:13px}
/* Primary buttons take the challenge's colour, so a treadmill challenge never
   shows a lifting-orange button. .sec and .danger keep their own styling. */
.k-lift .btn:not(.sec):not(.danger), .k-run .btn:not(.sec):not(.danger),
.k-body .btn:not(.sec):not(.danger), .k-fun .btn:not(.sec):not(.danger),
.k-lift .addset, .k-run .addset, .k-body .addset, .k-fun .addset{background:var(--k)}

/* runner */
.now{background:var(--surface);border:1px solid var(--k);border-radius:var(--r);
  padding:18px 14px;margin-bottom:12px;text-align:center}
.now .lbl{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.clock{font-size:58px;font-weight:600;letter-spacing:-.035em;line-height:1.05;margin:6px 0;
  font-variant-numeric:tabular-nums;color:var(--k)}
.clock.rest{color:var(--ink-2)}
.now .cue{font-size:19px;font-weight:650;font-variant-numeric:tabular-nums}
.now .nx{color:var(--ink-3);font-size:13px;margin-top:8px}
.bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--k);border-radius:3px;transition:width .3s linear}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.slot{min-width:52px;padding:8px 9px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface-2);font-size:14px;font-weight:650;text-align:center;
  font-variant-numeric:tabular-nums;color:var(--ink-3)}
.slot.done{background:var(--k);border-color:var(--k);color:#fff}
.slot.cur{border-color:var(--k);color:var(--k);box-shadow:inset 0 0 0 1px var(--k)}
.steplist{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.srow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;font-size:13.5px;
  background:var(--surface-2);color:var(--ink-3);font-variant-numeric:tabular-nums}
.srow.cur{background:var(--k);color:#fff;font-weight:650}
.srow.done{opacity:.45}
.srow .g{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- tabs ---------- */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(245,245,244,.93);
  backdrop-filter:saturate(160%) blur(14px);-webkit-backdrop-filter:saturate(160%) blur(14px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;height:var(--tabh);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;color:var(--ink-3);font-size:10px;font-weight:600;
  letter-spacing:.02em}
nav button.on{color:var(--accent)}
nav svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}

/* ---------- sheet / toast ---------- */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none;
  align-items:flex-end}
.sheet.on{display:flex}
.sheet .inner{background:var(--bg);border-top:1px solid var(--line);
  border-radius:18px 18px 0 0;width:100%;max-height:86vh;overflow-y:auto;
  padding:8px 14px calc(env(safe-area-inset-bottom) + 18px)}
.grab{width:36px;height:4px;border-radius:3px;background:var(--line);margin:6px auto 12px}
#toast{position:fixed;left:14px;right:14px;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 14px);
  background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  font-size:14px;z-index:60;opacity:0;transform:translateY(10px);transition:.18s;
  pointer-events:none;box-shadow:0 8px 26px rgba(0,0,0,.55)}
#toast.on{opacity:1;transform:none}
#toast.pb{border-color:var(--pb);color:#9c6a00;font-weight:600}
.banner{background:rgba(57,135,229,.12);border:1px solid rgba(57,135,229,.4);
  border-radius:12px;padding:12px 36px 12px 13px;font-size:13.5px;color:var(--ink-2);
  line-height:1.5;margin-bottom:12px;position:relative}
.banner b{color:var(--ink)}
.banner button{position:absolute;top:8px;right:10px;color:var(--ink-3);font-size:18px;padding:4px}
</style>
</head>
<body>

<div id="app">
  <!-- ============ HOME ============ -->
  <section class="view on" data-v="home">
    <div class="head">
      <div><h1>Today</h1><div class="sub" id="todayDate"></div></div>
      <button class="iconbtn" data-go="settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
          stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-2.87 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.18l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 3 15.4a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.18-2.9l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6V4a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.18l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 11H21a2 2 0 1 1 0 4h-.1"/></svg>
      </button>
    </div>
    <div id="installBanner"></div>
    <div id="homeNext"></div>
    <div class="card"><h2>This week</h2><div id="homeStats"></div></div>
    <div class="card"><h2>Bodyweight</h2><div id="homeWeight"></div></div>
    <div class="card"><h2>Recent</h2><div id="homeRecent" class="list"></div></div>
  </section>

  <!-- ============ LIFT ============ -->
  <section class="view" data-v="lift">
    <div id="liftBody"></div>
  </section>

  <!-- ============ CARDIO ============ -->
  <section class="view" data-v="cardio">
    <div class="head"><div><h1>Running</h1><div class="sub" id="runSub"></div></div></div>
    <div class="card"><h2>Log a run</h2><div id="runForm"></div></div>
    <div class="card"><h2>History</h2><div id="runList" class="list"></div></div>
  </section>

  <!-- ============ PROGRESS ============ -->
  <!-- ============ PLAY ============ -->
  <section class="view" data-v="play">
    <div id="playBody"></div>
  </section>

  <section class="view" data-v="progress">
    <div class="head"><div><h1>Progress</h1><div class="sub">Trends and personal bests</div></div></div>
    <div id="progBody"></div>
  </section>

  <!-- ============ SETTINGS ============ -->
  <section class="view" data-v="settings">
    <div class="head">
      <div><h1>Settings</h1><div class="sub">Routines, exercises, treadmill, backups</div></div>
      <button class="iconbtn" data-go="home" aria-label="Close">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="setBody"></div>
  </section>
</div>

<nav>
  <button data-go="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Home</button>
  <button data-go="lift"><svg viewBox="0 0 24 24"><path d="M4 9v6M7 6v12M17 6v12M20 9v6M7 12h10"/></svg>Lift</button>
  <button data-go="cardio"><svg viewBox="0 0 24 24"><circle cx="16" cy="4.5" r="1.8"/><path d="M8.5 21l2.2-5.4-2.6-2.3.9-4.6 3.4-1.5 2.8 2.6 2.9.9"/><path d="m11 8.2-3.6 1.3L5 13"/><path d="m13.4 15.6 2.4 2.1.9 3.3"/></svg>Run</button>
  <button data-go="play"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.6" cy="8.6" r="1.15" fill="currentColor" stroke="none"/><circle cx="15.4" cy="15.4" r="1.15" fill="currentColor" stroke="none"/><circle cx="15.4" cy="8.6" r="1.15" fill="currentColor" stroke="none"/><circle cx="8.6" cy="15.4" r="1.15" fill="currentColor" stroke="none"/></svg>Play</button>
  <button data-go="progress"><svg viewBox="0 0 24 24"><path d="M4 19V5"/><path d="M4 19h16"/><path d="m7.5 15 3.5-4.5 3 2.5L20 7"/></svg>Progress</button>
</nav>

<div class="sheet" id="sheet"><div class="inner"><div class="grab"></div><div id="sheetBody"></div></div></div>
<div id="toast"></div>

<script>
"use strict";
/* ============================================================
   Lift — offline personal training log
   Data lives in this device's localStorage. Nothing is uploaded.
   ============================================================ */
const KEY = "lift.v1";          // never change — renaming it orphans real history
const BAK = "lift.v1.pre2";     // one-shot copy of the v1 blob, taken before the v2 upgrade
const SCHEMA = 2;               // 1 = log only · 2 = + challenges, baselines
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---- dates (all local-time, never UTC-shifted) ---- */
const iso   = d => (d || new Date()).toLocaleDateString("en-CA");
const dObj  = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const dayMs = 864e5;
// Calendar-field arithmetic, not milliseconds — ms arithmetic slips a day
// across the March/October clock changes.
const addDays = (s, n) => { const d = dObj(s); d.setDate(d.getDate() + n); return iso(d); };
function mondayOf(s){ const d = dObj(s); const k = (d.getDay() + 6) % 7; return addDays(s, -k); }
const fmtDate = s => dObj(s).toLocaleDateString("en-GB", {weekday:"short", day:"numeric", month:"short"});
function relDate(s){
  const t = iso(), diff = Math.round((dObj(t) - dObj(s)) / dayMs);
  if (diff === 0) return "Today";
  if (diff === 1) return "Yesterday";
  if (diff < 7)   return diff + " days ago";
  return fmtDate(s);
}
/** relDate for use mid-sentence. Only the relative wordings lowercase — a
    blanket toLowerCase turns "Thu 13 Aug" into "thu 13 aug". */
const relPhrase = s => {
  const r = relDate(s);
  return /^(Today|Yesterday|\d+ days ago)$/.test(r) ? r.toLowerCase() : r;
};

/* ---- numbers ---- */
const num  = n => (Math.round(n * 100) / 100).toString();
const kg   = n => num(n) + " kg";
const e1rm = (w, r) => r <= 0 ? 0 : (r === 1 ? w : w * (1 + r / 30));   // Epley
function mmss(sec){
  sec = Math.round(sec);
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  return (h ? h + ":" + String(m).padStart(2,"0") : m) + ":" + String(s).padStart(2,"0");
}

/* ============================================================
   Seed data — Upper / Lower, twice a week
   ============================================================ */
function seed(){
  const E = [];
  const mk = (name, group, inc) => { const e = {id: uid(), name, group, inc}; E.push(e); return e.id; };
  const ua = [
    [mk("Barbell Bench Press","upper",2.5), 4, 6, 8],

  const la = [

    [mk("Romanian Deadlift","lower",2.5),   3, 8,10],
    [mk("Leg Press","lower",5),             3,10,12],
    [mk("Lying Leg Curl","lower",5),        3,10,12],
    [mk("Standing Calf Raise","lower",5),   4,10,15],

  const ub = [
    [mk("Overhead Press","upper",2.5),      4, 5, 8],
    [mk("Pull-up","upper",2.5),             4, 6,10],
    [mk("Incline Dumbbell Press","upper",2),3, 8,10],
    [mk("Seated Cable Row","upper",5),      3, 8,12],
    [mk("Lateral Raise","upper",2),         3,12,15],

  const lb = [
    [mk("Deadlift","lower",5),              3, 3, 5],
    [mk("Bulgarian Split Squat","lower",2), 3, 8,10],
    [mk("Leg Extension","lower",5),         3,10,12],
    [mk("Seated Leg Curl","lower",5),       3,10,12],

  const rt = (name, group, rows) => ({
    id: uid(), name, group,

  });
  const routines = [
    rt("Upper A","upper",ua), rt("Lower A","lower",la),

  return {

/* ============================================================
   Migration
   Real history lives in here and there is no server copy, so the rule is:
   fill in what is missing, never replace what is present. A bad blob must
   still yield a usable app, but it must not quietly bin someone's training.
   ============================================================ */
function migrate(raw){
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) return seed();
  const S2 = raw;

  // Exercises, routines and order are seeded as a set or not at all: routine
  // items store exercise ids, so pairing a saved exercise list with fresh seed
  // routines would leave every routine pointing at an id that isn't there.
  if (!Array.isArray(S2.ex) || !S2.ex.length){
    const base = seed();
    S2.ex = base.ex; S2.routines = base.routines; S2.order = base.order;
  }
  if (!Array.isArray(S2.routines)) S2.routines = [];
  // Drop dangling ids and append any routine the order forgot.
  if (!Array.isArray(S2.order)) S2.order = [];
  S2.order = S2.order.filter(id => S2.routines.some(r => r.id === id));
  S2.routines.forEach(r => { if (!S2.order.includes(r.id)) S2.order.push(r.id); });

  if (!Array.isArray(S2.sessions)) S2.sessions = [];
  if (!Array.isArray(S2.runs))     S2.runs = [];
  if (!Array.isArray(S2.weights))  S2.weights = [];
  if (S2.draft === undefined)      S2.draft = null;
  if (!S2.ui || typeof S2.ui !== "object") S2.ui = {};

  /* --- v1 → v2 --- */
  if (!Array.isArray(S2.challenges)) S2.challenges = [];
  if (!S2.bench || typeof S2.bench !== "object") S2.bench = {};
  if (S2.cdraft === undefined) S2.cdraft = null;

  S2.v = SCHEMA;
  return S2;
}

/* ============================================================
   State
   ============================================================ */
let S;
try {
  const rawStr = localStorage.getItem(KEY);
  const raw = rawStr ? JSON.parse(rawStr) : null;
  // Keep a copy of the v1 blob before the first v2 write. This history has no
  // server copy and no other backup, so the upgrade gets an undo.
  if (raw && (raw.v || 1) < SCHEMA && !localStorage.getItem(BAK)){
    try { localStorage.setItem(BAK, rawStr); } catch(e){}
  }
  S = migrate(raw);
} catch(e){ S = seed(); }
if (!S || !Array.isArray(S.ex) || !S.ex.length) S = seed();

let saveErr = false;
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); saveErr = false; }
  catch(e){
    if (!saveErr){ saveErr = true; toast("Could not save — device storage is full or blocked."); }
  }
}
const exById = id => S.ex.find(e => e.id === id);
const exName = id => (exById(id) || {name:"Deleted exercise"}).name;
const rtById = id => S.routines.find(r => r.id === id);

/* ============================================================
   Derived
   ============================================================ */
const doneSessions = () => S.sessions.slice().sort((a,b) => a.date < b.date ? 1 : -1);

/** Most recent completed sets for an exercise, before an optional session id. */
function lastPerformance(exId, skipId){
  for (const s of doneSessions()){
    if (s.id === skipId) continue;
    const en = s.entries.find(e => e.ex === exId && e.sets.length);
    if (en) return {date: s.date, sets: en.sets};
  }
  return null;
}
/** Best estimated 1RM ever recorded, optionally ignoring one session. */
function bestE1RM(exId, skipId){
  let best = 0;
  for (const s of S.sessions){
    if (s.id === skipId) continue;
    const en = s.entries.find(e => e.ex === exId);
    if (!en) continue;
    for (const st of en.sets) best = Math.max(best, e1rm(st.w, st.r));
  }
  return best;
}
/** One point per session: heaviest e1RM that day. */
function e1rmSeries(exId){
  const pts = [];
  for (const s of doneSessions().slice().reverse()){
    const en = s.entries.find(e => e.ex === exId);
    if (!en || !en.sets.length) continue;
    let best = null;
    for (const st of en.sets){
      const v = e1rm(st.w, st.r);
      if (!best || v > best.v) best = {v, w: st.w, r: st.r};
    }
    pts.push({t: s.date, y: best.v, w: best.w, r: best.r});
  }
  return pts;
}
const tonnage = s => s.entries.reduce((a,e) => a + e.sets.reduce((b,st) => b + st.w * st.r, 0), 0);

/** Trailing 7-day mean of bodyweight, one point per logged day. */
function weightMA(pts, win = 7){
  return pts.map(p => {
    const from = addDays(p.t, -(win - 1));
    const w = pts.filter(q => q.t >= from && q.t <= p.t);
    return {t: p.t, y: w.reduce((a,q) => a + q.y, 0) / w.length};
  });
}
const weightPts = () =>
  S.weights.slice().sort((a,b) => a.date < b.date ? -1 : 1).map(w => ({t: w.date, y: w.kg}));

function weekStats(weekStart){
  const end = addDays(weekStart, 7);
  const inWk = d => d >= weekStart && d < end;
  const ss = S.sessions.filter(s => inWk(s.date));
  const rs = S.runs.filter(r => inWk(r.date));
  const secs = rs.reduce((a,r) => a + r.sec, 0);
  const hrRuns = rs.filter(r => r.hr > 0);
  return {
    sessions: ss.length,
    tonnage: ss.reduce((a,s) => a + tonnage(s), 0),
    km: rs.reduce((a,r) => a + r.km, 0),
    runs: rs.length,
    sec: secs,
    // time-weighted, so a long steady run isn't outvoted by a short sprint
    hr: hrRuns.length
      ? hrRuns.reduce((a,r) => a + r.hr * r.sec, 0) / hrRuns.reduce((a,r) => a + r.sec, 0)
      : 0
  };
}
/** Bodyweight change: this week's 7-day mean vs last week's. Steadier than raw readings. */
function weightDelta(weekStart){
  const pts = weightPts();
  if (pts.length < 2) return null;
  const meanTo = end => {
    const w = pts.filter(p => p.t < end && p.t >= addDays(end, -7));
    return w.length ? w.reduce((a,p) => a + p.y, 0) / w.length : null;
  };
  const now = meanTo(addDays(weekStart, 7)), prev = meanTo(weekStart);
  return (now == null || prev == null) ? null : now - prev;
}

/* ============================================================
   Challenges — maths
   Every number a challenge prescribes comes from this file's own history.
   A challenge that asks for something unreachable gets ignored after two
   goes, so the calibration matters more than the challenge list does.
   ============================================================ */
const roundTo  = (x, step) => step > 0 ? Math.round(x / step) * step : Math.round(x);
const pct      = (max, p) => max * p;
/** Brzycki, shown next to Epley so the spread between the two is visible. */
const brzycki  = (w, r) => (r <= 0 || r >= 37) ? 0 : w * 36 / (37 - r);
/** Inverse Epley: the weight that should give exactly `reps`.
    The single-rep case mirrors e1rm's, which does not inflate a single —
    without it a 120 kg max reads back as a 116 kg "1RM". */
const repMax   = (max, reps) =>
  (max <= 0 || reps <= 0) ? 0 : (reps === 1 ? max : max / (1 + reps / 30));

const exByName = n => S.ex.find(e => e.name.toLowerCase() === String(n).toLowerCase());
/** Best estimated 1RM for an exercise named in a challenge definition.
    Challenges name lifts, not ids — ids are generated per install. */
function e1rmOf(name){
  const e = exByName(name);
  return e ? bestE1RM(e.id) : 0;
}
const incOf = name => { const e = exByName(name); return e ? e.inc : 2.5; };

/* ---- treadmill ----
   A treadmill takes numbers, not RPE, so challenges prescribe km/h and an
   incline. Limits are editable in Settings because they are machine-specific.
   The defaults are a NordicTrack T 6.5 S — 16 km/h and 0-10%, and the EU
   console reads km/h. Note the incline ceiling is 10, not the 12 that the
   usual "12-3-30" style workout assumes. */
const tmMax = () => S.ui.tmMax > 0 ? S.ui.tmMax : 16;
const tmInc = () => S.ui.tmInc > 0 ? S.ui.tmInc : 10;
const clampSpeed   = k => Math.min(tmMax(), Math.max(1, Math.round(k * 10) / 10));
const clampIncline = i => Math.min(tmInc(), Math.max(0, Math.round(i)));
const paceOf        = (km, sec) => km > 0 ? sec / km : 0;
const speedFromPace = secPerKm => secPerKm > 0 ? Math.round(3600 / secPerKm * 10) / 10 : 0;
const paceFromSpeed = kmh => kmh > 0 ? 3600 / kmh : 0;

/** Distance-weighted mean pace, so a long steady run counts for more than a
    short blast. Null when there is nothing recent to go on. */
function recentPace(days = 60){
  const from = addDays(iso(), -days);
  const rs = S.runs.filter(r => r.date >= from && r.km > 0 && r.sec > 0);
  if (!rs.length) return null;
  return rs.reduce((a,r) => a + r.sec, 0) / rs.reduce((a,r) => a + r.km, 0);
}
/** Fastest pace over a real distance — the basis for interval speeds. */
function bestPace(days = 120){
  const from = addDays(iso(), -days);
  const rs = S.runs.filter(r => r.date >= from && r.km >= 1 && r.sec > 0);
  if (!rs.length) return null;
  return Math.min(...rs.map(r => r.sec / r.km));
}
const EASY_FALLBACK = 390;   // 6:30 /km — only used until a run is logged
const HARD_FALLBACK = 330;   // 5:30 /km
const easyPace = () => recentPace() || EASY_FALLBACK;
const hardPace = () => bestPace() || Math.round(easyPace() * 0.9);

/* ---- bodyweight baselines ----
   Push-ups and holds are not in the training log, so the first challenge that
   needs one runs a short test and stores the number here. */
const baselineFor = k => (S.bench[k] && S.bench[k].v > 0) ? S.bench[k].v : 0;
function setBaseline(k, v){
  if (!(v > 0)) return null;
  S.bench[k] = {v: Math.round(v * 10) / 10, date: iso()};
  save();
  return S.bench[k];
}

/* ---- challenge history ---- */
const challengeById = cid => CHALLENGES.find(c => c.cid === cid);
const doneChallenges = () => S.challenges.slice().sort((a,b) => a.date < b.date ? 1 : -1);
const lastDoneAt = cid => {
  const ds = S.challenges.filter(c => c.cid === cid).map(c => c.date).sort();
  return ds.length ? ds[ds.length - 1] : null;
};
/** Best result for a challenge. `lower` challenges are timed, where less wins. */
function challengePB(cid){
  const done = S.challenges.filter(c => c.cid === cid && typeof c.score === "number");
  if (!done.length) return null;
  const lower = !!(challengeById(cid) || {}).lower;
  return done.reduce((b, x) =>
    (lower ? x.score < b.score : x.score > b.score) ? x : b);
}

/* Swappable so the draw can be tested deterministically. */
let RND = Math.random;
function setRnd(f){ RND = f || Math.random; }
const pickOne = arr => arr[Math.floor(RND() * arr.length) % arr.length];

/* The four lifts the strength challenges rotate through. */
const BIG = ["Back Squat", "Barbell Bench Press", "Deadlift", "Overhead Press"];
/** Least-recently-challenged big lift that actually has history behind it. */
function pickBig(){
  const withData = BIG.filter(n => e1rmOf(n) > 0);
  const pool = withData.length ? withData : BIG;
  const lastAt = n => {
    const ds = S.challenges.filter(x => x.exName === n).map(x => x.date).sort();
    return ds.length ? ds[ds.length - 1] : "0000-00-00";
  };
  return pool.slice().sort((a, b) =>
    lastAt(a) < lastAt(b) ? -1 : lastAt(a) > lastAt(b) ? 1 : (RND() - 0.5))[0];
}

/* ============================================================
   Challenges — the library
   Definitions live in code, not in localStorage, so new challenges arrive
   with an app update without touching saved results.

   cid       stable id — never reuse one, results are keyed on it
   kind      lift | run | body   (also the colour)
   mins      rough time cost, used by the "I've got 20 minutes" filter
   needs     false when there isn't enough history to prescribe honestly
   baseline  key in S.bench this challenge scales off, when one exists
   needsBaseline  key in S.bench it cannot be prescribed without — starting it
                  runs the test first rather than hiding the challenge, so the
                  prompt is the way in and not a wall
   prescribe returns the target the runner and the card both read
   lower     true when a smaller score is a better score (timed challenges)
   logAs     session | run | null — where the result lands in the main log
   ============================================================ */
const CHALLENGES = [
  /* ---------------- lifting ---------------- */
  {
    cid: "5x5", name: "5 × 5", kind: "lift", mins: 35, tags: ["strength"],
    blurb: "Five sets of five. Hard but never grindy — if the last set is a fight, it was right.",
    needs: () => BIG.some(n => e1rmOf(n) > 0),
    logAs: "session", lower: false,
    prescribe(){
      const n = pickBig(), max = e1rmOf(n);
      // 92% of a true 5RM: five sets of five is far more work than one set of five.
      const w = roundTo(repMax(max, 5) * 0.92, incOf(n));
      return {mode: "sets", exName: n, sets: 5, reps: 5, w, max,
              note: max ? `About ${Math.round(w / max * 100)}% of your estimated ${Math.round(max)} kg max.`
                        : "No history for this lift yet — start light and judge it."};
    },
    fmt: t => `5 × 5 · ${kg(t.w)}`,
    score: r => r.sets.reduce((a, s) => a + s.w * s.r, 0),
    scoreFmt: v => `${num(Math.round(v))} kg total`,
  },
  {
    cid: "amrap-75", name: "One all-out set", kind: "lift", mins: 20, tags: ["strength", "test"],
    blurb: "A single set at 75% taken to the point where the next rep would break form. Nothing else.",
    needs: () => BIG.some(n => e1rmOf(n) > 0),
    logAs: "session", lower: false,
    prescribe(){
      const n = pickBig(), max = e1rmOf(n);
      const w = roundTo(pct(max, 0.75), incOf(n));
      // Epley run backwards: 75% should be worth roughly ten reps.
      const expect = max ? Math.round((max / w - 1) * 30) : 10;
      return {mode: "sets", exName: n, sets: 1, reps: expect, w, max, amrap: true,
              note: `Ten reps is par at this weight. ${expect} would match your current estimate.`};
    },
    fmt: t => `AMRAP · ${kg(t.w)}`,
    score: r => r.sets.reduce((a, s) => a + s.r, 0),
    scoreFmt: v => `${v} reps`,
  },
  {
    cid: "ladder-12345", name: "Ladder to five", kind: "lift", mins: 25, tags: ["strength"],
    blurb: "1, 2, 3, 4, 5 reps with a full breath between rungs. Heavy, but the early rungs are free.",
    needs: () => BIG.some(n => e1rmOf(n) > 0),
    logAs: "session", lower: false,
    prescribe(){
      const n = pickBig(), max = e1rmOf(n);
      const w = roundTo(pct(max, 0.85), incOf(n));
      return {mode: "sets", exName: n, ladder: [1,2,3,4,5], w, max,
              sets: 5, reps: null,
              note: "Rest as long as the last rung took. Stop the ladder if a rep slows."};
    },
    fmt: t => `1-2-3-4-5 · ${kg(t.w)}`,
    score: r => r.sets.reduce((a, s) => a + s.w * s.r, 0),
    scoreFmt: v => `${num(Math.round(v))} kg total`,
  },
  {
    cid: "gvt-10x10", name: "Ten by ten", kind: "lift", mins: 40, tags: ["volume"],
    blurb: "Ten sets of ten at a weight that looks insultingly light for the first four sets.",
    needs: () => BIG.some(n => e1rmOf(n) > 0),
    logAs: "session", lower: false,
    prescribe(){
      const n = pickBig(), max = e1rmOf(n);
      const w = roundTo(pct(max, 0.55), incOf(n));
      return {mode: "sets", exName: n, sets: 10, reps: 10, w, max, rest: 90,
              note: "Ninety seconds between sets, no more. The weight is not the hard part."};
    },
    fmt: t => `10 × 10 · ${kg(t.w)}`,
    score: r => r.sets.reduce((a, s) => a + s.w * s.r, 0),
    scoreFmt: v => `${num(Math.round(v))} kg total`,
  },

  /* ---------------- treadmill ---------------- */
  {
    cid: "1k-tt", name: "1 km time trial", kind: "run", mins: 15, tags: ["test", "hard"],
    blurb: "One kilometre, flat, as fast as you can hold. Two minutes of walking first.",
    needs: () => true,
    logAs: "run", lower: true,
    prescribe(){
      const p = hardPace();
      const target = Math.round(p * 0.95);   // a time trial should beat interval pace
      return {mode: "single", km: 1, incline: 0,
              field: {key: "sec", label: "Your time", unit: "time"},
              guess: target, speed: clampSpeed(speedFromPace(target)),
              note: `Start at ${num(clampSpeed(speedFromPace(target)))} km/h and lift it in the last 300 m. `
                  + `${mmss(target)} would be a good day.`};
    },
    fmt: t => `1 km · target ${mmss(t.guess)}`,
    score: r => r.sec,
    scoreFmt: v => mmss(v),
  },
  {
    cid: "4x4", name: "Four by four", kind: "run", mins: 35, tags: ["intervals", "hard"],
    blurb: "Four minutes hard, three minutes easy, four times. The one that actually moves your engine.",
    needs: () => true,
    logAs: "run", lower: false,
    prescribe(){
      const hard = clampSpeed(speedFromPace(hardPace() * 1.02));
      const easy = clampSpeed(speedFromPace(easyPace() * 1.12));
      const steps = [{label: "Warm up", sec: 300, speed: easy, incline: 1}];
      for (let i = 1; i <= 4; i++){
        steps.push({label: `Hard ${i}/4`, sec: 240, speed: hard, incline: 1});
        if (i < 4) steps.push({label: `Easy ${i}/4`, sec: 180, speed: easy, incline: 1});
      }
      steps.push({label: "Cool down", sec: 240, speed: easy, incline: 0});
      return {mode: "timer", steps, hard, easy,
              note: `Hard is ${num(hard)} km/h, easy is ${num(easy)} km/h. `
                  + `If you can talk during the fourth interval, it wasn't hard.`};
    },
    fmt: t => `4 × 4 min @ ${num(t.hard)} km/h`,
    score: r => r.km,
    scoreFmt: v => `${num(v)} km`,
  },
  {
    cid: "30-30", name: "Thirty thirties", kind: "run", mins: 22, tags: ["intervals"],
    blurb: "Ten rounds of thirty seconds quick, thirty seconds easy. Short enough to be tempting.",
    needs: () => true,
    logAs: "run", lower: false,
    prescribe(){
      const hard = clampSpeed(speedFromPace(hardPace() * 0.94));
      const easy = clampSpeed(speedFromPace(easyPace() * 1.15));
      const steps = [{label: "Warm up", sec: 300, speed: easy, incline: 1}];
      for (let i = 1; i <= 10; i++){
        steps.push({label: `Quick ${i}/10`, sec: 30, speed: hard, incline: 1});
        steps.push({label: `Easy ${i}/10`,  sec: 30, speed: easy, incline: 1});
      }
      steps.push({label: "Cool down", sec: 180, speed: easy, incline: 0});
      return {mode: "timer", steps, hard, easy,
              note: `A treadmill takes a few seconds to change speed — start the belt moving up `
                  + `as the rest timer hits five.`};
    },
    fmt: t => `10 × 30 s @ ${num(t.hard)} km/h`,
    score: r => r.km,
    scoreFmt: v => `${num(v)} km`,
  },
  {
    cid: "incline-grind", name: "The incline grind", kind: "run", mins: 30, tags: ["steady"],
    blurb: "Half an hour uphill at a walk you could hold a conversation at, if you had the breath.",
    needs: () => true,
    logAs: "run", lower: false,
    prescribe(){
      const inc = clampIncline(12);
      const speed = clampSpeed(5.5);
      return {mode: "timer", steps: [
                {label: "Ease in",  sec: 180,  speed: clampSpeed(4.5), incline: clampIncline(4)},
                {label: "Climb",    sec: 1500, speed, incline: inc},
                {label: "Walk off", sec: 120,  speed: clampSpeed(4),   incline: 0}],
              hard: speed, easy: speed,
              note: `${num(speed)} km/h at ${inc}% — hands off the rails, that's the whole exercise.`};
    },
    fmt: t => `30 min @ ${t.steps[1].incline}% incline`,
    score: r => r.km,
    scoreFmt: v => `${num(v)} km`,
  },

  /* ---------------- bodyweight ---------------- */
  {
    cid: "pushup-100", name: "One hundred push-ups", kind: "body", mins: 12, tags: ["for time"],
    blurb: "A hundred push-ups, as few sets as it takes. The clock runs the whole time.",
    needs: () => true, baseline: "pushup",
    logAs: null, lower: true,
    prescribe(){
      const b = baselineFor("pushup");
      return {mode: "single", reps: 100,
              field: {key: "sec", label: "Time taken", unit: "time"},
              note: b ? `At a best set of ${b}, sets of ${Math.max(5, Math.round(b * 0.6))} `
                      + `with short rests will get you there fastest.`
                      : "Break it into sets well short of failure from the very first one."};
    },
    fmt: () => "100 reps for time",
    score: r => r.sec,
    scoreFmt: v => mmss(v),
  },
  {
    cid: "pushup-emom", name: "Push-ups on the minute", kind: "body", mins: 12, tags: ["emom"],
    blurb: "A set every minute for ten minutes. Rest is whatever's left of the minute.",
    needs: () => true, baseline: "pushup", needsBaseline: "pushup",
    logAs: null, lower: false,
    prescribe(){
      const b = baselineFor("pushup") || 25;
      // 40% of a max set is about the most that survives ten repeats.
      const reps = Math.max(3, Math.round(b * 0.4));
      const steps = Array.from({length: 10}, (_, i) =>

              note: `${reps} a minute, from a best set of ${b}. `
                  + `If minute eight is comfortable you under-tested your max.`};
    },
    fmt: t => `10 × ${t.reps} on the minute`,

/* Baseline tests. Not in the draw — they are offered when a challenge needs a
   number that isn't there yet. */
const BASELINES = {
  pushup: {key: "pushup", name: "Max push-ups", unit: "reps",
           ask: "One set of push-ups to form failure. How many?",
           field: {key: "v", label: "Reps", unit: "reps"}},
  plank:  {key: "plank",  name: "Longest plank", unit: "time",
           ask: "One plank, held until the hips drop. How long?",
           field: {key: "v", label: "Time held", unit: "time"}},
};

/* ---- the draw ---- */
/** Challenges that can be prescribed right now. */
function eligible(opts){
  const o = opts || {};
  const today = iso();
  return CHALLENGES.filter(c => {
    if (o.kind && c.kind !== o.kind) return false;
    if (o.maxMins && c.mins > o.maxMins) return false;
    if (c.needs && !c.needs()) return false;
    // Baselines are collected on the way in, so a missing one is not a block
    // unless the challenge itself insists on it via needs().
    if (o.fresh){
      const last = lastDoneAt(c.cid);
      if (last && last >= addDays(today, -2)) return false;   // done in the last 48h
    }
    return true;
  });
}
/**
 * Pick one challenge, weighted so that things you haven't touched come up more.
 * @param {{kind?:string, maxMins?:number, avoid?:string}} opts
 */
function drawChallenge(opts){
  const o = opts || {};
  let pool = eligible(Object.assign({fresh: true}, o));
  if (!pool.length) pool = eligible(o);               // relax the 48h rule
  if (o.avoid && pool.length > 1) pool = pool.filter(c => c.cid !== o.avoid);
  if (!pool.length) return null;

  const today = iso();
  const weight = c => {
    const last = lastDoneAt(c.cid);
    if (!last) return 4;                              // never tried — favour it
    const days = Math.round((dObj(today) - dObj(last)) / dayMs);
    return days >= 28 ? 3 : days >= 14 ? 2 : 1;
  };
  const total = pool.reduce((a, c) => a + weight(c), 0);
  let r = RND() * total;
  for (const c of pool){ r -= weight(c); if (r <= 0) return c; }
  return pool[pool.length - 1];
}

/* ============================================================
   Charts — hand-rolled SVG, tap for values
   ============================================================ */
const AX = {l: 36, r: 14, t: 12, b: 22};

function niceTicks(min, max, n = 4){
  if (min === max){ min -= 1; max += 1; }
  const raw = (max - min) / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || 10 * mag;
  // Round the top tick *up* past max, or points above it render outside the plot.
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, ticks = [];
  for (let v = lo; v <= hi + step * 1e-6; v += step) ticks.push(+v.toFixed(6));
  return ticks;
}

/**
 * Time-series line. `series[0]` is the emphasised line; an optional second entry
 * is drawn recessive (raw readings under a moving average).
 */
function lineChart(host, {series, unit = "", fmt = num, zero = false}){
  const main = series[0];
  if (!main.pts.length){ host.innerHTML = '<div class="empty">No data yet.</div>'; return; }

  const W = host.clientWidth || 320, H = host.clientHeight || 172;
  const all = series.flatMap(s => s.pts);
  const xs = all.map(p => dObj(p.t).getTime());
  let x0 = Math.min(...xs), x1 = Math.max(...xs);
  if (x0 === x1){ x0 -= dayMs; x1 += dayMs; }
  const ys = all.map(p => p.y);
  const ticks = niceTicks(zero ? 0 : Math.min(...ys), Math.max(...ys));
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];

  const px = t => AX.l + (dObj(t).getTime() - x0) / (x1 - x0) * (W - AX.l - AX.r);
  const py = v => H - AX.b - (v - y0) / (y1 - y0 || 1) * (H - AX.t - AX.b);

  let g = "";
  for (const v of ticks){
    const y = py(v).toFixed(1);
    g += `<line x1="${AX.l}" y1="${y}" x2="${W-AX.r}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`
       + `<text x="${AX.l-7}" y="${+y+3.5}" text-anchor="end" font-size="10" fill="var(--ink-3)">${fmt(v)}</text>`;
  }
  let paths = "";
  series.slice().reverse().forEach(s => {                       // recessive layer first
    const d = s.pts.map((p,i) => (i ? "L" : "M") + px(p.t).toFixed(1) + " " + py(p.y).toFixed(1)).join(" ");
    paths += s.dots
      ? s.pts.map(p => `<circle cx="${px(p.t).toFixed(1)}" cy="${py(p.y).toFixed(1)}" r="2.6" fill="${s.color}" opacity=".65"/>`).join("")
      : `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  });

  const lp = main.pts[main.pts.length - 1];
  const lx = px(lp.t), ly = py(lp.y);
  const anchor = lx > W - 62 ? "end" : "start";
  // Keep the label inside the plot, and halo it so it stays legible over the dots.
  const lly = Math.min(H - AX.b - 5, Math.max(AX.t + 11, ly - 10));
  paths += `<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4.5" fill="${main.color}" stroke="var(--surface)" stroke-width="2"/>`
        +  `<text x="${(lx + (anchor === "end" ? -9 : 9)).toFixed(1)}" y="${lly.toFixed(1)}" text-anchor="${anchor}" font-size="11.5" font-weight="650" fill="var(--ink)" paint-order="stroke" stroke="var(--surface)" stroke-width="3.5" stroke-linejoin="round">${fmt(lp.y)}${unit}</text>`;

  const dLab = p => dObj(p.t).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
  const axis = `<text x="${AX.l}" y="${H-6}" font-size="10" fill="var(--ink-3)">${dLab(main.pts[0])}</text>`
    + (main.pts.length > 1 ? `<text x="${W-AX.r}" y="${H-6}" text-anchor="end" font-size="10" fill="var(--ink-3)">${dLab(lp)}</text>` : "");

  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`
    + g + paths + axis
    + `<line class="cx" x1="0" y1="${AX.t}" x2="0" y2="${H-AX.b}" stroke="var(--ink-3)" stroke-width="1" opacity="0"/>`
    + `<circle class="cd" r="5.5" fill="${main.color}" stroke="var(--surface)" stroke-width="2" opacity="0"/>`
    + `</svg><div class="tip"></div>`;

  attachProbe(host, main.pts, p => ({
    x: px(p.t), y: py(p.y),
    html: `<b>${fmt(p.y)}${unit}</b> <i>${fmtDate(p.t)}</i>`
        + (p.w != null ? `<br><i>top set ${num(p.w)}×${p.r}</i>` : "")
  }));
}

/** Bars over discrete buckets (weeks). Always zero-based. */
function barChart(host, {bars, color, unit = "", fmt = num}){
  if (!bars.length){ host.innerHTML = '<div class="empty">No data yet.</div>'; return; }
  const W = host.clientWidth || 320, H = host.clientHeight || 172;
  const ticks = niceTicks(0, Math.max(...bars.map(b => b.y), 1));
  const y1 = ticks[ticks.length - 1];
  const iw = (W - AX.l - AX.r) / bars.length, bw = Math.max(6, Math.min(30, iw - 6));
  const py = v => H - AX.b - v / (y1 || 1) * (H - AX.t - AX.b);

  let g = "";
  for (const v of ticks){
    const y = py(v).toFixed(1);
    g += `<line x1="${AX.l}" y1="${y}" x2="${W-AX.r}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`
       + `<text x="${AX.l-7}" y="${+y+3.5}" text-anchor="end" font-size="10" fill="var(--ink-3)">${fmt(v)}</text>`;
  }
  let m = "", lab = "";
  bars.forEach((b,i) => {
    const cx = AX.l + iw * (i + .5), top = py(b.y), h = H - AX.b - top;
    if (b.y > 0)
      m += `<rect x="${(cx-bw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,2).toFixed(1)}" rx="4" fill="${color}"/>`;
    if (i === 0 || i === bars.length - 1 || bars.length <= 6)
      lab += `<text x="${cx.toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${b.label}</text>`;
  });
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${g}${m}${lab}</svg><div class="tip"></div>`;

  attachProbe(host, bars.map((b,i) => ({...b, _i: i})), b => ({
    x: AX.l + iw * (b._i + .5), y: py(b.y),
    html: `<b>${fmt(b.y)}${unit}</b> <i>${b.full || b.label}</i>`
  }));
}

/** Shared tap/drag readout for both chart types. */
function attachProbe(host, items, map){
  const svg = $("svg", host), tip = $(".tip", host);
  const cx = $(".cx", svg), cd = $(".cd", svg);
  const pos = items.map(map);
  let on = false;
  const show = e => {
    const r = svg.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    let bi = 0;
    pos.forEach((p,i) => { if (Math.abs(p.x - x) < Math.abs(pos[bi].x - x)) bi = i; });
    const p = pos[bi];
    tip.innerHTML = p.html;
    tip.style.left = Math.max(52, Math.min(r.width - 52, p.x)) + "px";
    tip.style.top  = p.y + "px";
    tip.classList.add("on");
    if (cx){ cx.setAttribute("x1", p.x); cx.setAttribute("x2", p.x); cx.setAttribute("opacity", ".45"); }
    if (cd){ cd.setAttribute("cx", p.x); cd.setAttribute("cy", p.y); cd.setAttribute("opacity", "1"); }
    on = true;
  };
  const hide = () => {
    if (!on) return;
    tip.classList.remove("on");
    if (cx) cx.setAttribute("opacity", "0");
    if (cd) cd.setAttribute("opacity", "0");
    on = false;
  };
  host.addEventListener("touchstart", show, {passive:true});
  host.addEventListener("touchmove",  show, {passive:true});
  host.addEventListener("touchend",   hide);
  host.addEventListener("mousemove",  show);
  host.addEventListener("mouseleave", hide);
}

      <div class="fld"><label>reps</label><div class="step">
        <button data-act="step" data-i="${i}" data-f="r" data-d="-1">&minus;</button>
        <input inputmode="numeric" data-in="r" data-i="${i}" value="${en.r != null ? en.r : ""}" placeholder="0">
        <button data-act="step" data-i="${i}" data-f="r" data-d="1">+</button>
      </div></div>
      <button class="addset" data-act="logset" data-i="${i}">Log</button>
    </div>
    ${showHint ? `<div class="hint">Tap a set to pull it back for editing.</div>` : ""}
  </div>`;
}

function startSession(rid){
  const r = rid ? rtById(rid) : null;
  S.draft = {
    id: uid(), date: iso(), rid: r ? r.id : null,
    name: r ? r.name : "Free session", started: Date.now(),
    entries: r ? r.items.map(it => {
      const p = lastPerformance(it.ex);
      return {
        ex: it.ex, sets: [], sets_t: it.sets, rl: it.rl, rh: it.rh,
        w: p ? p.sets[p.sets.length - 1].w : null,       // prefill from last time
        r: it.rl
      };
    }) : []
  };
  save(); go("lift");
}

function finishSession(){
  const d = S.draft;
  d.entries = d.entries.filter(e => e.sets.length);
  if (!d.entries.length){ S.draft = null; save(); toast("Empty session discarded."); return go("lift"); }

  const pbs = [];
  for (const en of d.entries){
    const before = bestE1RM(en.ex, d.id);
    const now = Math.max(...en.sets.map(s => e1rm(s.w, s.r)));
    if (before > 0 && now > before) pbs.push(exName(en.ex));
  }
  d.ended = Date.now();
  d.entries.forEach(e => { delete e.w; delete e.r; });
  S.sessions.push(d);
  S.draft = null;
  save(); go("home");
  toast(pbs.length
    ? `★ Personal best: ${pbs.slice(0,2).join(", ")}${pbs.length > 2 ? ` +${pbs.length-2} more` : ""}`
    : `Session saved · ${num(Math.round(tonnage(d)))} kg lifted`, pbs.length > 0);
}

function saveRun(){

/* ============================================================
   Play — draw a challenge, run it, log it
   ============================================================ */

/* One shared clock for every timed challenge. It is wall-clock based, not a
   tick count: iOS suspends timers the moment the screen locks, and anything
   counting ticks would silently under-run a four-minute interval. */
let tmr = null;
function stopClock(){ if (tmr){ clearInterval(tmr); tmr = null; } }
function startClock(){ stopClock(); tmr = setInterval(tickClock, 250); }

/* A beep is worth more than the screen on a treadmill. The context is created
   inside the Start tap because iOS will not let audio start without a gesture. */
let actx = null;
function ensureAudio(){
  try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); }
  catch(e){ actx = null; }
}
function beep(freq, ms, gain){
  if (!actx) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = "sine"; o.frequency.value = freq;
    g.gain.value = gain == null ? 0.22 : gain;
    o.connect(g); g.connect(actx.destination);
    const t = actx.currentTime;
    o.start(t); g.gain.setValueAtTime(g.gain.value, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + ms / 1000);
    o.stop(t + ms / 1000);
  } catch(e){}
}

const nowMs = () => Date.now();
/** Seconds left in the running step, or null when there is no timed step. */
function stepLeft(){
  const d = S.cdraft;
  if (!d || !d.target.steps) return null;
  const st = d.target.steps[d.prog.i];
  if (!st) return null;
  if (d.prog.paused) return d.prog.left;
  return st.sec - (nowMs() - d.prog.t0) / 1000;
}

function tickClock(){
  const d = S.cdraft;
  if (!d || !d.target.steps){ stopClock(); return; }
  if (d.prog.paused) return;

  const left = stepLeft();
  const steps = d.target.steps;

  if (left <= 0){
    // Advance. Two short beeps into a new step, one long one at the end.
    if (d.prog.i + 1 < steps.length){
      d.prog.i++; d.prog.t0 = nowMs();
      save(); beep(880, 120); setTimeout(() => beep(880, 120), 160);
      return renderPlay();
    }
    d.prog.i = steps.length - 1;
    d.prog.paused = true; d.prog.left = 0;
    save(); stopClock(); beep(660, 500);
    return renderPlay();
  }

  // Countdown into the next step, so the belt can be changed in time.
  const whole = Math.ceil(left);
  if (whole <= 3 && whole >= 1 && d.prog.cue !== whole){ d.prog.cue = whole; beep(1320, 70, 0.14); }

  const clk = $("#clk"); if (clk) clk.textContent = mmss(Math.max(0, left));
  const bar = $("#bar > i");
  if (bar) bar.style.width = (100 * (1 - left / steps[d.prog.i].sec)).toFixed(1) + "%";
}

/* ---- draw / start ---- */
function drawInto(avoid){
  const c = drawChallenge({
    kind: S.ui.pk || undefined,
    maxMins: S.ui.pm || undefined,
    avoid: avoid || undefined,
  });
  // The prescription is generated once and stored. Re-rolling the weight on
  // every re-render would make the card look like it was lying.
  S.ui.draw = c ? {cid: c.cid, target: c.prescribe()} : null;
  save();
  renderPlay();
  if (!c) toast("Nothing matches that filter.");
}

function startChallenge(cid, target){
  const c = challengeById(cid);
  if (!c) return;
  // Only a challenge that cannot be prescribed without a benchmark stops for
  // one; the rest have a sensible fallback and shouldn't make you test first.
  if (c.needsBaseline && !baselineFor(c.needsBaseline))
    return baselineSheet(c.needsBaseline, cid);

  const t = target || c.prescribe();
  S.cdraft = {
    cid, target: t, started: nowMs(),
    prog: t.mode === "timer"
      ? {i: 0, t0: nowMs(), paused: true, left: t.steps[0].sec, cue: 0}
      : {sets: []}
  };
  save(); ensureAudio(); go("play");
}

function abandonChallenge(){
  if (!confirm("Give up on this challenge? Nothing will be logged.")) return;
  stopClock(); S.cdraft = null; save(); renderPlay();
  toast("Challenge abandoned.");
}

/* ---- baseline tests ---- */
function baselineSheet(key, thenCid){
  const b = BASELINES[key];
  if (!b) return;
  const timed = b.field.unit === "time";
  sheet(`<h2 style="font-size:19px;margin-bottom:6px">${b.name}</h2>
    <div class="hint" style="margin:0 0 14px;font-size:13.5px;line-height:1.5">${b.ask}
      Do it now — the challenges scale off this number, so a flattering guess
      only makes them wrong.</div>
    ${timed
      ? `<div class="row" style="margin-bottom:12px">
           <div class="fld"><label>Minutes</label><input id="bMin" inputmode="numeric" placeholder="1"></div>
           <div class="fld"><label>Seconds</label><input id="bSec" inputmode="numeric" placeholder="30"></div>
         </div>`
      : `<div class="fld" style="margin-bottom:12px"><label>${b.field.label}</label>
           <input id="bVal" inputmode="numeric" placeholder="25"></div>`}
    <button class="btn" data-act="bSave" data-key="${key}" data-then="${thenCid || ""}">Save benchmark</button>
    <button class="btn sec sm" style="margin-top:8px" data-act="closeSheet">Not now</button>`);
}

/* ---- the runner ---- */
function renderRunner(b){
  const d = S.cdraft, c = challengeById(d.cid), t = d.target;
  if (!c){ S.cdraft = null; save(); return renderPlay(); }

  const head = `<div class="head"><div><h1>${c.name}</h1>
      <div class="sub">${t.exName ? esc(t.exName) + " · " : ""}${c.fmt(t)}</div></div>
    <button class="iconbtn" data-act="abandon" aria-label="Give up">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>`;

  b.innerHTML = head + `<div class="k-${c.kind}">` +
    (t.mode === "timer" ? runnerTimer(c, t, d) :
     t.mode === "sets"  ? runnerSets(c, t, d)  : runnerSingle(c, t, d)) + `</div>`;

  if (t.mode === "timer" && !d.prog.paused) startClock(); else stopClock();
  if (t.mode === "sets") wireSteppers();
}

function runnerTimer(c, t, d){
  const steps = t.steps, i = d.prog.i, st = steps[i];
  const left = Math.max(0, stepLeft());
  const last = i === steps.length - 1;
  const finished = last && left <= 0;
  const nx = steps[i + 1];
  const rest = /easy|rest|cool|walk/i.test(st.label);

  return `<div class="now">
      <div class="lbl">${esc(st.label)}</div>
      <div class="clock ${rest ? "rest" : ""}" id="clk">${mmss(left)}</div>
      <div class="cue">${
        st.speed ? `${num(st.speed)} km/h${st.incline ? ` · ${st.incline}% incline` : " · flat"}`
        : st.reps ? `${st.reps} reps` : "&nbsp;"}</div>
      <div class="bar" id="bar"><i style="width:${(100 * (1 - left / st.sec)).toFixed(1)}%"></i></div>
      <div class="nx">${finished ? "Done — log it below."
        : nx ? `Next: ${esc(nx.label)}${nx.speed ? ` at ${num(nx.speed)} km/h` : ""}`
             : "Last one."}</div>
    </div>

    ${finished ? `<button class="btn" data-act="chalFinish">Log this challenge</button>`
    : `<div class="row">
        <button class="btn" data-act="tPause">${d.prog.paused ? (d.prog.left === st.sec && i === 0 ? "Start" : "Resume") : "Pause"}</button>
        <button class="btn sec" data-act="tSkip">Skip step</button>
      </div>`}

    <div class="card" style="margin-top:12px"><h2>The session</h2>
      <div class="steplist">${steps.map((s, j) =>
        `<div class="srow ${j === i ? "cur" : j < i ? "done" : ""}">
          <div class="g">${esc(s.label)}</div>
          <div>${s.speed ? num(s.speed) + " km/h" : s.reps ? s.reps + " reps" : ""}</div>
          <div style="width:44px;text-align:right">${mmss(s.sec)}</div>
        </div>`).join("")}</div>
      ${t.note ? `<div class="hint">${t.note}</div>` : ""}
      <button class="btn sec sm" style="margin-top:10px" data-act="chalFinish">Finish early and log it</button>
    </div>`;
}

function runnerSets(c, t, d){
  const done = d.prog.sets;
  const n = t.sets;
  const planned = j => t.ladder ? t.ladder[j] : t.reps;
  const cur = done.length;
  const left = Math.max(0, n - cur);
  const inc = incOf(t.exName);
  const lastSet = done[done.length - 1];
  const w = lastSet ? lastSet.w : t.w;
  const r = t.amrap ? (lastSet ? lastSet.r : planned(cur) || 10) : (planned(cur) || t.reps || 5);

  return `<div class="now">
      <div class="lbl">${left ? `Set ${cur + 1} of ${n}` : "All sets logged"}</div>
      <div class="clock">${left ? `${num(t.w)} kg` : "✓"}</div>
      <div class="cue">${
        !left ? `${done.reduce((a,s)=>a+s.r,0)} reps total`
        : t.amrap ? "as many as form allows"
        : `${planned(cur)} reps${t.rest ? ` · ${t.rest}s rest` : ""}`}</div>
      <div class="slots">${Array.from({length: n}, (_, j) =>
        `<div class="slot ${j < cur ? "done" : j === cur ? "cur" : ""}">${
          j < cur ? `${done[j].r}×` + num(done[j].w) : (planned(j) || "?")}</div>`).join("")}</div>
    </div>

    ${left ? `<div class="card">
      <div class="entry" style="margin-top:0">
        <div class="fld"><label>Weight</label>
          <div class="step">
            <button data-act="cStep" data-f="w" data-d="-${inc}">&minus;</button>
            <input id="cW" inputmode="decimal" data-cin="w" value="${num(w)}">
            <button data-act="cStep" data-f="w" data-d="${inc}">+</button>
          </div></div>
        <div class="fld"><label>Reps</label>
          <div class="step">
            <button data-act="cStep" data-f="r" data-d="-1">&minus;</button>
            <input id="cR" inputmode="numeric" data-cin="r" value="${r}">
            <button data-act="cStep" data-f="r" data-d="1">+</button>
          </div></div>
        <button class="addset" data-act="cLog">Log</button>
      </div>
      ${cur ? `<button class="btn sec sm" style="margin-top:10px" data-act="cUndo">Undo last set</button>` : ""}
      ${t.rest ? `<div class="hint">${t.rest} seconds between sets.</div>` : ""}
    </div>` : ""}

    <div class="card"><h2>Why this weight</h2>
      <div class="hint" style="margin-top:0">${t.note || ""}</div>
      ${cur ? `<button class="btn" style="margin-top:12px" data-act="chalFinish">Log this challenge</button>` : ""}
    </div>`;
}

function runnerSingle(c, t, d){
  const timed = t.field.unit === "time";
  return `<div class="now">
      <div class="lbl">${t.reps ? "The task" : "Target"}</div>
      <div class="clock">${c.fmt(t)}</div>
      <div class="cue">${t.speed ? `start at ${num(t.speed)} km/h` : t.reps ? `${t.reps} reps` : "&nbsp;"}</div>
    </div>
    <div class="card"><h2>${t.field.label}</h2>
      ${timed
        ? `<div class="row">
            <div class="fld"><label>Minutes</label><input id="sMin" inputmode="numeric" placeholder="4"></div>
            <div class="fld"><label>Seconds</label><input id="sSec" inputmode="numeric" placeholder="30"></div>
          </div>`
        : `<div class="fld"><input id="sVal" inputmode="numeric" placeholder="0"></div>`}
      <button class="btn" style="margin-top:12px" data-act="chalFinish">Save result</button>
      ${t.note ? `<div class="hint">${t.note}</div>` : ""}
    </div>`;
}

/* Keep typed values in state so a re-render doesn't drop them. */
function wireSteppers(){
  $$("[data-cin]").forEach(el => el.addEventListener("input", () => {}));
}
function readSetInputs(t){
  const wEl = $("#cW"), rEl = $("#cR");
  return {
    w: wEl ? (parseFloat(wEl.value) || 0) : t.w,
    r: rEl ? (parseInt(rEl.value) || 0) : 0,
  };
}

/* ---- finishing ---- */
/** Seconds from a minutes/seconds pair of inputs. */
function readMmss(minSel, secSel){
  return (parseInt(($(minSel) || {}).value) || 0) * 60 + (parseInt(($(secSel) || {}).value) || 0);
}

function finishChallenge(){
  const d = S.cdraft; if (!d) return;
  const c = challengeById(d.cid), t = d.target;

  if (t.mode === "sets"){
    if (!d.prog.sets.length) return toast("Log at least one set first.");
    return commitChallenge(c, t, {sets: d.prog.sets});
  }

  if (t.mode === "single"){
    const v = t.field.unit === "time" ? readMmss("#sMin", "#sSec") : (parseFloat(($("#sVal") || {}).value) || 0);
    if (!(v > 0)) return toast(t.field.unit === "time" ? "Enter your time." : "Enter a number.");
    const res = t.field.key === "sec" ? {sec: v} : {v};
    // A time trial is a real run over a known distance — it belongs in the log.
    if (c.logAs === "run" && t.km > 0) res.km = t.km;
    return commitChallenge(c, t, res);
  }

  // Timer: a treadmill's own distance is the honest one, so it gets confirmed.
  const elapsed = t.steps.slice(0, d.prog.i + 1).reduce((a, s) => a + s.sec, 0);
  if (c.logAs === "run"){
    const estKm = Math.round(t.steps.reduce((a, s) => a + (s.speed || 0) * s.sec / 3600, 0) * 100) / 100;
    return sheet(`<h2 style="font-size:19px;margin-bottom:6px">Log the run</h2>
      <div class="hint" style="margin:0 0 14px">Take the distance off the treadmill console —
        it won't match the estimate, and the console is the one that counts.</div>
      <div class="row" style="margin-bottom:10px">
        <div class="fld"><label>Distance (km)</label><input id="fKm" inputmode="decimal" value="${num(estKm)}"></div>
        <div class="fld"><label>Avg HR</label><input id="fHr" inputmode="numeric" placeholder="—"></div>
      </div>
      <div class="row" style="margin-bottom:12px">
        <div class="fld"><label>Minutes</label><input id="fMin" inputmode="numeric" value="${Math.floor(elapsed/60)}"></div>
        <div class="fld"><label>Seconds</label><input id="fSec" inputmode="numeric" value="${elapsed%60}"></div>
      </div>
      <button class="btn" data-act="chalCommitRun">Save it</button>`);
  }

  // Timed bodyweight work: rounds completed is the score.
  const rounds = t.rounds || t.steps.filter(s => s.reps).length;
  return sheet(`<h2 style="font-size:19px;margin-bottom:6px">How did it go?</h2>
    <div class="hint" style="margin:0 0 14px">Rounds you completed in full. Stopping short is
      information, not failure — the next target reads this number.</div>
    <div class="fld" style="margin-bottom:12px"><label>Rounds completed</label>
      <input id="fRounds" inputmode="numeric" value="${rounds}"></div>
    <button class="btn" data-act="chalCommitRounds" data-max="${rounds}">Save it</button>`);
}

/**
 * Write a finished challenge into the log.
 * Results land in the main history too, so the e1RM chart and weekly volume
 * stay honest — a heavy challenge set is still a heavy set.
 */
function commitChallenge(c, t, result){
  const date = iso();
  const score = c.score(result);
  const prev = challengePB(c.cid);
  const isPb = typeof score === "number" &&
    (!prev || (c.lower ? score < prev.score : score > prev.score));

  let detail = "";
  if (result.sets){
    detail = `${result.sets.length} sets · ${result.sets.reduce((a,s) => a + s.r, 0)} reps`;
  } else if (result.km != null){
    detail = `${num(result.km)} km in ${mmss(result.sec)}`;
  } else if (result.rounds != null){
    detail = `${result.rounds} rounds`;
  } else if (result.sec != null){
    detail = mmss(result.sec);
  }

  S.challenges.push({
    id: uid(), cid: c.cid, date, name: c.name, kind: c.kind,
    exName: t.exName || null, score, detail,
    target: c.fmt(t),
  });

  // Mirror into the main log where it belongs there.
  if (c.logAs === "session" && result.sets && result.sets.length){
    const e = exByName(t.exName);
    if (e){
      S.sessions.push({
        id: uid(), rid: null, chal: c.cid, name: c.name, date,
        entries: [{ex: e.id, sets: result.sets.map(s => ({w: s.w, r: s.r}))}],
      });
    }
  }
  if (c.logAs === "run" && result.km > 0 && result.sec > 0){
    S.runs.push({id: uid(), chal: c.cid, date, km: result.km, sec: result.sec, hr: result.hr || 0});
  }

  stopClock();
  S.cdraft = null;
  S.ui.draw = null;
  save(); closeSheet(); go("play");

  if (isPb){ beep(1046, 160); setTimeout(() => beep(1318, 240), 180); }
  toast(isPb ? `Best yet — ${c.scoreFmt(score)}.` : `Logged · ${c.scoreFmt(score)}`, isPb);
}

let progEx = null;
function renderProgress(){
  const wpts = weightPts();
  const withData = S.ex.filter(e => S.sessions.some(s => s.entries.some(en => en.ex === e.id && en.sets.length)));
  if (!withData.some(e => e.id === progEx)) progEx = withData.length ? withData[0].id : null;

  // weekly running volume, last 8 weeks
  const wk0 = mondayOf(iso());
  const bars = Array.from({length: 8}, (_, i) => {
    const ws = addDays(wk0, -(7 * (7 - i)));
    const km = S.runs.filter(r => r.date >= ws && r.date < addDays(ws, 7))
                     .reduce((a, r) => a + r.km, 0);
    return {label: dObj(ws).toLocaleDateString("en-GB",{day:"numeric",month:"short"}),
            full: "Week of " + fmtDate(ws), y: Math.round(km * 10) / 10};
  });

  const pbRows = S.ex.map(e => {
    let best = null;
    for (const s of S.sessions){
      const en = s.entries.find(x => x.ex === e.id);
      if (!en) continue;
      for (const st of en.sets){
        const v = e1rm(st.w, st.r);
        if (!best || v > best.v) best = {v, w: st.w, r: st.r, date: s.date};
      }
    }
    return best ? {name: e.name, ...best} : null;
  }).filter(Boolean).sort((a,b) => b.v - a.v);

  $("#progBody").innerHTML = `
    <div class="card"><h2>Bodyweight</h2>
      <div class="chart" id="cW"></div>
      <div class="legend"><span><i class="sw ln" style="background:var(--aqua)"></i>7-day average</span>
        <span><i class="sw" style="background:var(--aqua);opacity:.65;border-radius:50%"></i>Daily reading</span></div>
    </div>
    <div class="card"><h2>Strength — estimated 1RM</h2>
      ${withData.length ? `<select id="progSel" style="margin-bottom:10px">${
        withData.map(e => `<option value="${e.id}" ${e.id === progEx ? "selected" : ""}>${esc(e.name)}</option>`).join("")}</select>
      <div class="chart" id="cE"></div>
      <div class="hint">Epley estimate from your heaviest set each session. Tap the line for the set behind each point.</div>`
      : `<div class="empty">Log a few sessions and your strength trend appears here.</div>`}
    </div>
    <div class="card"><h2>Running — weekly volume</h2>
      <div class="chart" id="cR"></div>
      <div class="hint">Kilometres per week, last 8 weeks.</div>
    </div>
    <div class="card"><h2>Personal bests</h2><div class="list">${
      pbRows.length ? pbRows.map(p => `<div class="item">
        <div class="g"><div class="t">${esc(p.name)}</div>
          <div class="d">${num(p.w)} kg × ${p.r} · ${fmtDate(p.date)}</div></div>
        <div class="r"><b>${num(Math.round(p.v))}</b><div class="d" style="font-size:12px">est. 1RM</div></div>
      </div>`).join("") : `<div class="empty">No lifts recorded yet.</div>`}</div></div>`;

  if (wpts.length)
    lineChart($("#cW"), {series: [
      {pts: weightMA(wpts), color: "var(--aqua)"},
      {pts: wpts, color: "var(--aqua)", dots: true}
    ], unit: " kg"});
  else $("#cW").innerHTML = `<div class="empty">Log your bodyweight on the Home tab to start the trend.</div>`;

  if (progEx){
    lineChart($("#cE"), {series: [{pts: e1rmSeries(progEx), color: "var(--accent)"}], unit: " kg"});
    $("#progSel").addEventListener("change", e => { progEx = e.target.value; renderProgress(); });
  }
  barChart($("#cR"), {bars, color: "var(--blue)", unit: " km"});
}

/* ============================================================
   Backup
   ============================================================ */
async function exportData(){
  const name = `lift-backup-${iso()}.json`;
  const text = JSON.stringify(S, null, 2);
  const file = new File([text], name, {type: "application/json"});
  if (navigator.canShare && navigator.canShare({files: [file]})){
    try { await navigator.share({files: [file], title: name}); return; }
    catch(e){ if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type: "application/json"}));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function importData(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = () => {
    const f = inp.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      let d;
      try { d = JSON.parse(rd.result); } catch(e){ return toast("That file isn't valid JSON."); }
      if (!d || !Array.isArray(d.ex) || !Array.isArray(d.sessions))
        return toast("That doesn't look like a Lift backup.");
      if (!confirm(`Replace everything on this device with this backup?\n\n${d.sessions.length} sessions, ${(d.runs||[]).length} runs, ${(d.weights||[]).length} weigh-ins.`)) return;
      S = d;
      S.runs = S.runs || []; S.weights = S.weights || []; S.ui = S.ui || {};
      save(); go("home"); toast("Backup restored.");
    };
    rd.readAsText(f);
  };
  inp.click();
}
